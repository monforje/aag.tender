<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 16" class="mk-spread" aria-hidden="true">
  <!-- РАЗБРОС. Горизонтальная линейка размаха: две засечки — границы, бусина —
       сам объект внутри диапазона. Горизонталь не случайна, это «разброс по
       строке»: направление глифа совпадает с направлением, вдоль которого
       разброс и меряется.
       Засечки стоят точно на концах оси (x=3 и x=21), поэтому торец оси butt
       ложится в середину чернила засечки — сварено без выступа. Наконечники не
       ставлю: наконечник значит «дальше ещё есть», а у диапазона концы конечны.
       Бусина на 0.41 длины — это честный параметр, cx можно считать из перцентиля
       цены, глиф тогда становится дешёвой мини-диаграммой.
       Габариты в покое x 2.15…21.85; на пике раздвижки 0.85…23.15 — внутри бокса,
       overflow не нужен. -->
  <g fill="none" stroke="rgb(233,61,130)" stroke-width="1.7" stroke-linecap="round">
    <path class="mk-axis" d="M3 8 H21" stroke-linecap="butt"/>
    <path class="mk-cap-l" d="M3 4.8 V11.2"/>
    <path class="mk-cap-r" d="M21 4.8 V11.2"/>
    <circle cx="10.2" cy="8" r="2.1" fill="rgb(233,61,130)" stroke="none"/>
  </g>
</svg>
