<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 18" class="mk-key" aria-hidden="true">
  <!-- КЛЮЧ, самостоятельный маркер. Кольцо и нить убраны, ключ развёрнут из
       диагонали в горизонталь: диагональ была нужна только чтобы висеть на нитке,
       без подвеса она ничем не оправдана, а горизонталь стоит в строке ровно и
       не тянет взгляд вниз. Бокс сменился с портретного 26×30 на 28×18 — площадь
       почти та же, но вся она под ключом, поэтому при одинаковой высоте строки
       глиф читается крупнее.
       Сварка: головка r=5 при штрихе 2 даёт чернильное кольцо 4…6 от центра;
       стержень начинается в x=12 с круглым торцом, то есть его левый край ровно
       11 — внутренняя кромка кольца. Стык заварен, в дырку торец не лезет.
       Дырка r=1.9 штрихом 1.3: просвет 2.5, зазор до кольца 1.45 — обе величины
       держат при 20px, ниже начинается грязь.
       Бородка: ближний зуб 4.4, дальний 3.2, за ним чистый носик 2.5 — так режут
       настоящую ногу, и убывание читается даже когда глиф провёрнут.
       Габариты ровно по чернилу: x 1…26.5, y 3…15. -->
  <g fill="none" stroke="rgb(214,119,10)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="9" r="5"/>
    <circle cx="7" cy="9" r="1.9" stroke-width="1.3"/>
    <path d="M12 9 H25.5"/>
    <path d="M19.5 9 V13.4"/>
    <path d="M23 9 V12.2"/>
  </g>
</svg>
