<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="mk-coin" aria-hidden="true">
<!-- ЗАПАС ТОРГА — монета, НЕ клон ценника: бирка уже занята «мин», второй
     висячий ярлык читался бы тем же самым. Тон INFO, а не success: зелёный уже
     занят минимумом, пара «зелёная бирка + зелёная монета» сливалась бы в одно
     пятно. Монета стоит У ЦЕНТРАЛЬНОЙ ЛИНИИ цены слева, прислонившись под
     наклоном -14° (опора — нижний правый край, точка transform-origin 78% 82%).
     Наклон и место задаются CSS (.badge-torg), здесь только геометрия: гурт
     r=9 штрихом 1.8, внутренний ободок r=6.6 альфой .4, знак рубля БЕЗ обводки
     (stroke="none"), иначе группа обведёт глиф своим штрихом. -->
  <g fill="none" stroke="rgb(29,110,220)" stroke-width="1.8">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="6.6" stroke-opacity=".4" stroke-width="1"/>
    <text x="12" y="15.4" text-anchor="middle" fill="rgb(29,110,220)" stroke="none"
          font-size="9" font-weight="700">₽</text>
  </g>
</svg>
