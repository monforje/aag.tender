<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 19" class="mk-median" aria-hidden="true">
<!-- ДОРОЖЕ МЕДИАНЫ. Леденец: пунктирный уровень отсчёта внизу, стержень вверх,
     бусина-объект на конце. Стрелка отброшена сознательно — стрелка означает
     «растёт», это тренд во времени; здесь же ничего не растёт, объект просто
     стоит выше уровня. Высота стержня — и есть величина превышения, то есть
     глиф в принципе способен нести число, если однажды понадобится.
     Тон NEUTRAL-INK, а не info: info отдан монете запаса торга, а этот маркер —
     самый тихий в таблице, отсчёт, а не тревога и не возможность; серый читает
     его честно. Штрихи глифа ведутся -ink (#646464): базовый neutral
     (rgb 150) на белом слишком прозрачен для линии толщиной 1.4–1.8.
     Пунктир: длина 18, ритм 2/1.2, торцы butt — ровно 6 штрихов впритык к обоим
     краям, без обрубка. Butt обязателен: при round каждый штрих прирастал бы
     на 1.4, промежуток 1.2 схлопнулся бы в ноль и уровень читался бы сплошным,
     то есть как объект данных, а не как линейка.
     Стержень кончается в 15.7 — это нижняя кромка чернила пунктира. На пике
     подъёма (−1.4) он кончается в 14.3 — верхняя кромка. То есть в любой фазе
     анимации торец лежит внутри чернила линии: ни свеса в покое, ни щели на
     подъёме. Бусина r=2.4 садится на стержень с перехлёстом 1.4.
     Габариты в покое: x 2…20, y 3.6…15.7; на пике верх бусины 2.2 — внутри бокса. -->
  <g fill="none" stroke="#646464" stroke-linecap="butt">
    <g class="mk-rise">
      <path d="M11 15.7 V7" stroke-width="1.8"/>
      <circle cx="11" cy="6" r="2.4" fill="#646464"/>
    </g>
    <path d="M2 15 H20" stroke-width="1.4" stroke-dasharray="2 1.2"/>
  </g>
    <path d="M2 15 H20" stroke-width="1.4" stroke-dasharray="2 1.2"/>
  </g>
</svg>
