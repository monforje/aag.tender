<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 40">
  <!-- Итерация 4, финальная: бирка повёрнута на 12° вокруг центра ПРОКОЛА
       (10,17) — точка подвеса и ось вращения совпадают, поэтому на ниточке
       она и висит, и качается физически честно. Габариты после поворота:
       x 2.5…48.7, y 5.5…36.4 — вписаны в 52×40 с запасом под нить.
       Надпись по центру прямоугольной части (x=29), капителью, как на
       ценнике; цвет текста — белый поверх сплошного тона success.
       В демо цвета заменяются на var(--tone-*) при инлайне в страницу. -->
  <g transform="rotate(12 10 17)">
    <path fill="rgb(0,138,86)" fill-rule="evenodd" d="
      M 11 5 L 43 5 Q 47 5 47 9 L 47 25 Q 47 29 43 29 L 11 29
      L 4.2 21.4 Q 2.5 19.4 2.5 17 Q 2.5 14.6 4.2 12.6 Z
      M 12.2 17 a 2.2 2.2 0 1 0 -4.4 0 a 2.2 2.2 0 1 0 4.4 0 Z"/>
    <circle cx="10" cy="17" r="3.6" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="1.2"/>
    <text x="29" y="20" text-anchor="middle" fill="#fff"
          font-size="8.5" font-weight="700" letter-spacing=".8">МИН</text>
  </g>
  <path fill="none" stroke="rgb(0,138,86)" stroke-width="1.1" stroke-linecap="round"
        d="M 1.5 .5 C 1.7 7.5 4.2 12.8 8.6 16"/>
</svg>
